<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/portal :: head('登录 - 青枫CMS')"></head>
<body>

<header th:replace="fragments/portal :: header('login', ${session.loginUser})"></header>

<div class="auth-wrap">
    <div class="auth-card">
        <h2>欢迎回来</h2>
        <div class="sub">登录青枫CMS，管理你的站点内容</div>

        <div class="alert-error" th:if="${error != null}" th:text="${error}">错误提示</div>

        <form method="post" action="/login">
            <div class="form-row">
                <label>用户名</label>
                <input class="input" type="text" name="username" placeholder="请输入用户名" th:value="${username}" required>
            </div>
            <div class="form-row">
                <label>密码</label>
                <input class="input" type="password" name="password" placeholder="请输入密码" required>
            </div>
            <button class="btn btn-primary" type="submit" style="width:100%;padding:11px">登 录</button>
        </form>
        <p style="font-size:12.5px;color:#b6bec9;margin-top:18px;text-align:center">
            演示账号：admin / admin123　·　zhangsan / zhang@2026
        </p>
    </div>
</div>

<footer th:replace="fragments/portal :: footer"></footer>
</body>
</html>

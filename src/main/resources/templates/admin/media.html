<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/admin :: head('媒体库')"></head>
<body>
<div class="admin-shell">
    <div th:replace="fragments/admin :: sidebar('media')"></div>

    <div class="admin-main">
        <div class="admin-topbar">
            <span class="crumb">内容管理 / 媒体库 / 外链预览</span>
            <span class="user-chip"><span class="avatar">A</span> admin</span>
        </div>

        <div class="admin-content">
            <div class="card tool-form">
                <div class="card-title">外链资源预览</div>
                <p class="desc">输入外链图片或资源的 URL，系统将请求该地址并返回可访问性检测结果，用于审核站外图片是否可用。</p>
                <form method="get" action="/admin/media/preview" class="inline-form">
                    <input class="input" type="text" name="url" placeholder="http://example.com/images/banner.png" th:value="${url}">
                    <button class="btn btn-primary" type="submit">检测并预览</button>
                </form>
            </div>

            <div class="card" th:if="${status != null}">
                <div class="card-title">检测结果</div>
                <p style="margin-bottom:12px">
                    目标地址：<code class="inline" th:text="${url}">url</code><br>
                    响应状态：<span class="badge badge-blue" th:text="${status}">HTTP 200</span>
                </p>
                <div class="pre-box" th:if="${!#strings.isEmpty(body)}" th:text="${body}">响应内容</div>
            </div>
        </div>
    </div>
</div>
</body>
</html>

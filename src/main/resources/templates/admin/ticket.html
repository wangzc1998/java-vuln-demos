<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/admin :: head('工单系统')"></head>
<body>
<div class="admin-shell">
    <div th:replace="fragments/admin :: sidebar('ticket')"></div>

    <div class="admin-main">
        <div class="admin-topbar">
            <span class="crumb">工单系统 / 附件导入</span>
            <span class="user-chip"><span class="avatar">A</span> admin</span>
        </div>

        <div class="admin-content">
            <div class="card tool-form">
                <div class="card-title">工单附件导入</div>
                <p class="desc">客户提交的工单数据包为 Base64 编码的序列化附件，粘贴后系统将自动解析并恢复为对象进行处理。</p>
                <form method="post" action="/admin/ticket">
                    <div class="form-row">
                        <textarea class="input" name="base64" rows="8" placeholder="粘贴附件的 Base64 数据包" th:text="${base64Input}"></textarea>
                    </div>
                    <button class="btn btn-primary" type="submit">解析附件</button>
                </form>
            </div>

            <div class="card" th:if="${result != null}">
                <div class="card-title">解析结果</div>
                <div class="pre-box" th:text="${result}">结果</div>
            </div>
        </div>
    </div>
</div>
</body>
</html>

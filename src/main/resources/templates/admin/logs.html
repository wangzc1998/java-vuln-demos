<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/admin :: head('系统日志')"></head>
<body>
<div class="admin-shell">
    <div th:replace="fragments/admin :: sidebar('logs')"></div>

    <div class="admin-main">
        <div class="admin-topbar">
            <span class="crumb">系统 / 系统日志</span>
            <span class="user-chip"><span class="avatar">A</span> admin</span>
        </div>

        <div class="admin-content">
            <div class="alert-ok" th:if="${logged}">备注已写入审计日志。</div>

            <div class="card tool-form">
                <div class="card-title">日志备注</div>
                <p class="desc">对当前班次的运维情况写入一条审计备注，备注内容将随系统日志一并落盘归档。</p>
                <form method="get" action="/admin/logs" class="inline-form">
                    <input class="input" type="text" name="remark" placeholder="例如：已完成昨晚的例行巡检" th:value="${remark}">
                    <button class="btn btn-primary" type="submit">写入日志</button>
                </form>
            </div>

            <div class="card">
                <div class="card-title">日志归档文件</div>
                <table class="data-table">
                    <tr><th>文件名</th><th>说明</th><th>大小</th></tr>
                    <tr th:each="f : ${logFiles}">
                        <td><code class="inline" th:text="${f[0]}">log</code></td>
                        <td th:text="${f[1]}">说明</td>
                        <td th:text="${f[2]}">大小</td>
                    </tr>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
